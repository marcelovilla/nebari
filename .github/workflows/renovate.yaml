name: Renovate

on:
  workflow_dispatch:

jobs:
    renovate:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Run Renovate
          uses: renovatebot/github-action@v41.0.20
          with:
            token: ${{ github.token }}
          env:
            RENOVATE_REPOSITORIES: marcelovilla/nebari